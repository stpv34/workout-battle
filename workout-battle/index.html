<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Battle</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E1424">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Battle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#16203A; --muted:#5B6478; --line:#D3D9E2;
  --push:#C8102E; --pull:#1F57B5; --legs:#E8A900; --on-legs:#16203A; --ok:#1E7A4C;
  --fig-ink:#2B3140; --fig-skin:#FFFFFF; --fig-cloth:#C9D7EA; --fig-eq:#F1F3F6; --fig-pad:#DDE3EC; --fig-accent:#C8102E;
  --day:var(--ink); --on-day:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --surface:#18213A; --surface-2:#1F2945; --ink:#E9EDF5; --muted:#9BA5BB; --line:#2D3858;
    --push:#E0334F; --pull:#4B82E0; --legs:#F2B705; --ok:#3DBE7E;
    --fig-ink:#D9DEE8; --fig-skin:#1F2945; --fig-cloth:#3D5680; --fig-eq:#2A3554; --fig-pad:#33405F; --fig-accent:#E0334F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#18213A; --surface-2:#1F2945; --ink:#E9EDF5; --muted:#9BA5BB; --line:#2D3858;
  --push:#E0334F; --pull:#4B82E0; --legs:#F2B705; --ok:#3DBE7E;
  --fig-ink:#D9DEE8; --fig-skin:#1F2945; --fig-cloth:#3D5680; --fig-eq:#2A3554; --fig-pad:#33405F; --fig-accent:#E0334F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pull);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.muted{color:var(--muted)} .small{font-size:14px}
.topbar{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.back{border:0;background:var(--surface);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.topbar h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:34px;line-height:1;margin:0}
.topbar .sub{font-size:14px;color:var(--muted)}
.note{background:var(--surface);border-left:4px solid var(--push);padding:10px 12px;border-radius:8px;font-size:15px;margin-bottom:14px}
.hello{margin:8px 0 18px}
.hello h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:44px;line-height:.95;margin:0}
.hello p{margin:6px 0 0;color:var(--muted)}
.days{display:grid;gap:14px}
.day{position:relative;overflow:hidden;border:0;border-radius:18px;min-height:112px;padding:18px 20px;text-align:left;background:var(--day);color:var(--on-day);display:flex;flex-direction:column;justify-content:flex-end;transition:box-shadow .3s}
.day .name{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:56px;line-height:.9;position:relative;z-index:1}
.day .meta{font-size:14px;opacity:.9;position:relative;z-index:1;margin-top:4px}
.plate{position:absolute;right:-46px;top:50%;width:170px;height:170px;transform:translateY(-50%);border-radius:50%;border:14px solid rgba(255,255,255,.22)}
.plate::after{content:"";position:absolute;inset:50px;border-radius:50%;border:8px solid rgba(255,255,255,.22)}
.day[data-day="legs"] .plate,.day[data-day="legs"] .plate::after{border-color:rgba(22,32,58,.18)}
.day.next{box-shadow:0 0 0 4px var(--bg),0 0 0 7px color-mix(in srgb,var(--day) 45%,transparent),0 8px 28px color-mix(in srgb,var(--day) 40%,transparent)}
.upnext{position:absolute;top:14px;left:20px;z-index:1;font-size:13px;font-weight:600;letter-spacing:.3px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.24)}
.day[data-day="legs"] .upnext{background:rgba(22,32,58,.12)}
@media (prefers-reduced-motion:no-preference){.day.next{animation:glow 2.8s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 7px color-mix(in srgb,var(--day) 25%,transparent),0 8px 22px color-mix(in srgb,var(--day) 25%,transparent)}}}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:2px solid var(--day);background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:14px;text-align:left}
.resume b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:700}
.chev{transform:rotate(180deg);width:22px;height:22px;display:block}
.recent{margin-top:28px}
.recent h2,.section-h{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:24px;margin:0 0 8px}
.section-h{margin-top:18px}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:0;background:var(--surface);border-radius:16px;padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.pic{display:block;width:100%;aspect-ratio:1;border-radius:12px;background:var(--surface-2);overflow:hidden}
.pic svg{display:block;width:100%;height:100%}
.pic.pending{display:grid;place-items:center;color:var(--muted)}
.pic.pending svg{width:50%;height:50%}
.card .nm{font-weight:600;font-size:16px;line-height:1.2}
.card .lt{font-size:13px;color:var(--muted)}
.card.done{box-shadow:inset 0 0 0 2px var(--ok)}
.card.done .lt{color:var(--ok);font-weight:600}
.check{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;z-index:1}
.check svg{width:16px;height:16px}
.card.add{border:2px dashed var(--line);background:transparent;align-items:center;justify-content:center;color:var(--muted);min-height:180px}
.card.add .plus{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:56px;line-height:.8;font-weight:600}
.card.lib .nm{font-size:15px}
.empty{background:var(--surface);border-radius:14px;padding:18px;margin-bottom:12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.bar .in{max-width:560px;margin:0 auto}
.btn{width:100%;border:0;border-radius:14px;min-height:56px;padding:12px 16px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:24px;background:var(--day);color:var(--on-day)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);font-size:20px;min-height:50px}
.ex-head{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.ex-head .pic{width:104px;flex:none;background:var(--surface)}
.ex-head h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:34px;line-height:1;margin:0}
.last{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.last .lh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.last .lh b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;line-height:1.1}
.chip small{font-family:"Barlow",sans-serif;font-size:13px;font-weight:500;color:var(--muted)}
.last .nt{font-size:14px;color:var(--muted);margin-top:8px}
.linkbtn{border:0;background:none;color:var(--day);font-weight:600;padding:6px 0;font-size:15px}
.day-legs .linkbtn{color:var(--ink)}
.sets{display:grid;gap:8px;margin-bottom:10px}
.set{display:grid;grid-template-columns:44px 1fr 1fr 40px;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:8px}
.set .n{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;text-align:center;color:var(--muted)}
.field{position:relative}
.field input{width:100%;height:58px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);padding:14px 10px 2px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:28px;text-align:center}
.field input::placeholder{color:var(--muted);opacity:.55}
.field input:focus{border-color:var(--day);outline:none}
.field label{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.rm{border:0;background:none;width:40px;height:40px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.rm svg{width:20px;height:20px}
.addset{width:100%;border:2px dashed var(--line);background:transparent;border-radius:14px;min-height:52px;font-weight:600;color:var(--muted);margin-bottom:16px}
textarea{width:100%;min-height:64px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:16px;resize:vertical}
.lbl{display:block;font-weight:600;margin:0 0 6px}
.input{width:100%;height:54px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:18px}
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg.wrap{flex-wrap:wrap}
.seg button{flex:1 1 30%;border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:21px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--day);background:var(--day);color:var(--on-day)}
.rv{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.rv b{font-weight:600}
.err{color:var(--push);font-weight:600;margin:10px 0}
.saved{text-align:center;padding-top:30px}
.saved .big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:64px;line-height:1;margin:16px 0 6px}
.saved .ring{width:120px;height:120px;margin:0 auto;border-radius:50%;border:16px solid var(--day);position:relative}
.saved .ring::after{content:"";position:absolute;inset:22px;border-radius:50%;border:6px solid var(--day)}
@media (prefers-reduced-motion:no-preference){.saved .ring{animation:spin .7s ease-out 1}@keyframes spin{from{transform:rotate(-120deg) scale(.7);opacity:0}to{transform:none;opacity:1}}}
.piccard{background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:22px}
.piccard .section-h{margin-top:0}
.picrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.picrow:first-of-type{border-top:0}
.picrow .pic{width:72px;flex:none}
.grow{flex:1;min-width:0}
.pill{border:0;border-radius:999px;background:var(--day);color:var(--on-day);padding:8px 16px;font-weight:600}
@media (min-width:520px){.grid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
(function(){
// Line-art figure renderer. Side view, figure faces right. viewBox 0 0 200 200, floor y=190.
function P(a){return a[0].toFixed(1)+" "+a[1].toFixed(1)}
function lerp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function sub(a,b){return[a[0]-b[0],a[1]-b[1]]}
function add(a,b){return[a[0]+b[0],a[1]+b[1]]}
function mul(a,k){return[a[0]*k,a[1]*k]}
function len(a){return Math.hypot(a[0],a[1])||1}
function norm(a){var l=len(a);return[a[0]/l,a[1]/l]}
function perp(a){return[-a[1],a[0]]}
var W={ua:10,fa:8.5,th:14,sh:10.5,neck:8};
function limb(pts,w,cls){var d="M"+pts.map(P).join(" L");return '<path d="'+d+'" class="o" stroke-width="'+(w+4.4)+'"/><path d="'+d+'" class="'+(cls||"s")+'" stroke-width="'+w+'"/>'}
function limbFill(pts,w,cls){var d="M"+pts.map(P).join(" L");return '<path d="'+d+'" class="'+(cls||"s")+'" stroke-width="'+w+'"/>'}
function foot(ankle,dir){dir=dir||[1,0.05];var d=norm(dir);var toe=add(ankle,mul(d,11));var heel=add(ankle,mul(d,-3.5));
  return '<path d="M'+P(heel)+' L'+P(toe)+'" class="o" stroke-width="10.4"/><path d="M'+P(heel)+' L'+P(toe)+'" class="s" stroke-width="6.2"/>'}
function hand(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5.6" class="of"/>'}
function torso(neck,hip,k){k=k||1;
  var v=sub(hip,neck),n=norm(perp(v));
  var sh=lerp(neck,hip,0.12),ch=lerp(neck,hip,0.35),wa=lerp(neck,hip,0.78);
  var pts=[add(neck,mul(n,7)),add(sh,mul(n,12*k)),add(ch,mul(n,12.5*k)),add(wa,mul(n,10*k)),add(hip,mul(n,11*k)),
           add(hip,mul(n,-11*k)),add(wa,mul(n,-9.5*k)),add(ch,mul(n,-11*k)),add(sh,mul(n,-11*k)),add(neck,mul(n,-7))];
  return pts;
}
function poly(pts,cls){return '<path d="M'+pts.map(P).join(" L")+' Z" class="'+cls+'"/>'}
function smoothPoly(pts,cls){ // closed Catmull-Rom
  var d="M"+P(pts[0]);var n=pts.length;
  for(var i=0;i<n;i++){var p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    var c1=add(p1,mul(sub(p2,p0),1/6)),c2=sub(p2,mul(sub(p3,p1),1/6));d+=" C"+P(c1)+" "+P(c2)+" "+P(p2)}
  return '<path d="'+d+' Z" class="'+cls+'"/>'}
function head(h,neck,face,front){
  if(front){var up0=norm(sub(h,neck));var t='<circle cx="'+h[0].toFixed(1)+'" cy="'+h[1].toFixed(1)+'" r="10.5" class="of"/>';var l=add(h,[-10.5,-1]),r=add(h,[10.5,-1]),c=add(h,[0,-17]);t+='<path d="M'+P(l)+' Q'+P(c)+' '+P(r)+' Q'+P(add(h,[0,-6]))+' '+P(l)+' Z" class="hair"/>';return t}
  face=face||[1,0];var f=norm(face);
  var hairC=add(h,mul(f,-2.5));
  var s='<circle cx="'+h[0].toFixed(1)+'" cy="'+h[1].toFixed(1)+'" r="10.5" class="of"/>';
  // hair cap: arc on the back/top
  var up=norm(sub(h,neck));var back=mul(f,-1);
  var a=add(h,add(mul(up,10.5),mul(f,4))), b=add(h,add(mul(back,10.5),mul(up,-3)));
  var c=add(h,add(mul(up,13.5),mul(back,6)));
  s+='<path d="M'+P(a)+' Q'+P(c)+' '+P(b)+' Q'+P(add(h,add(mul(back,5),mul(up,4))))+' '+P(a)+' Z" class="hair"/>';
  s+='<circle cx="'+add(h,mul(back,1.5))[0].toFixed(1)+'" cy="'+add(h,mul(back,1.5))[1].toFixed(1)+'" r="2" class="ear"/>';
  return s;
}
// equipment
var EQ={
  floor:function(){return '<line x1="-400" y1="191" x2="600" y2="191" class="line thin"/>'},
  db:function(x,y,a){a=a||0;return '<g transform="translate('+x+' '+y+') rotate('+a+')"><line x1="-10" y1="0" x2="10" y2="0" class="line"/><rect x="-16" y="-8" width="7" height="16" rx="2" class="eqf"/><rect x="9" y="-8" width="7" height="16" rx="2" class="eqf"/></g>'},
  dbEnd:function(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="8.5" class="eqf"/><circle cx="'+x+'" cy="'+y+'" r="3" class="eqf"/>'},
  plate:function(x,y,r){r=r||19;return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" class="eqf"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*0.62).toFixed(1)+'" class="eqline"/><circle cx="'+x+'" cy="'+y+'" r="3" class="eqf"/>'},
  barTop:function(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" class="line"/>'},
  pad:function(x1,y1,x2,y2,w){w=w||9;var a=[x1,y1],b=[x2,y2],n=norm(perp(sub(b,a)));var p=[add(a,mul(n,0)),add(b,mul(n,0)),add(b,mul(n,w)),add(a,mul(n,w))];
    return '<path d="M'+p.map(P).join(" L")+' Z" class="pad" stroke-linejoin="round"/>'},
  post:function(x,y1,y2){return '<line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'" class="line thick"/>'},
  leg:function(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" class="line"/>'},
  pulley:function(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="5" class="eqf"/>'},
  cable:function(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" class="cable"/>'},
  stack:function(x,y,h){h=h||60;var s='<rect x="'+(x-9)+'" y="'+y+'" width="18" height="'+h+'" rx="2" class="eqf"/>';for(var i=1;i<h/8;i++)s+='<line x1="'+(x-9)+'" y1="'+(y+i*8)+'" x2="'+(x+9)+'" y2="'+(y+i*8)+'" class="line thin"/>';return s},
  handle:function(x,y,a){a=a||0;return '<g transform="translate('+x+' '+y+') rotate('+a+')"><rect x="-7" y="-3" width="14" height="6" rx="3" class="eqf"/></g>'},
  rope:function(x,y,dx,dy){return '<path d="M'+x+' '+y+' l'+dx+' '+dy+'" class="line thick"/>'},
  box:function(x,y,w,h){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" class="pad"/>'},
  arrow:function(x1,y1,x2,y2){var a=[x1,y1],b=[x2,y2],d=norm(sub(b,a)),n=perp(d);var h1=add(b,add(mul(d,-6),mul(n,4))),h2=add(b,add(mul(d,-6),mul(n,-4)));
    return '<path d="M'+P(a)+' L'+P(b)+' M'+P(h1)+' L'+P(b)+' L'+P(h2)+'" class="arrow"/>'}
};
function bbox(p){var xs=[],ys=[];function pt(x,y){xs.push(x);ys.push(y)}
  [p.head,p.neck,p.hip].forEach(function(a){pt(a[0],a[1])});pt(p.head[0]-12,p.head[1]-14);pt(p.head[0]+12,p.head[1]+12);
  ['na','fa','nl','fl'].forEach(function(k){if(p[k]){pt(p[k][0][0],p[k][0][1]);pt(p[k][1][0]-8,p[k][1][1]-8);pt(p[k][1][0]+8,p[k][1][1]+8);
    if(k==='nl'||k==='fl'){var d=norm(p[k][2]||[1,0.05]);pt(p[k][1][0]+d[0]*15,p[k][1][1]+d[1]*15)}}});
  ['bg','mid','fg'].forEach(function(k){(p[k]||[]).forEach(function(e){var t=e[0],a=e.slice(1);
    if(t==='plate'){var r=a[2]||19;pt(a[0]-r,a[1]-r);pt(a[0]+r,a[1]+r)}
    else if(t==='dbEnd'||t==='pulley'){pt(a[0]-9,a[1]-9);pt(a[0]+9,a[1]+9)}
    else if(t==='db'||t==='handle'){pt(a[0]-14,a[1]-14);pt(a[0]+14,a[1]+14)}
    else if(t==='box'){pt(a[0],a[1]);pt(a[0]+a[2],a[1]+a[3])}
    else if(t==='post'){pt(a[0],a[1]);pt(a[0],a[2])}

      r.appendChild(h("div",{class:"rrow"},
        h("div",null,h("span",{class:"dot",style:"background:"+(DAY_TONE[s.day]?DAY_TONE[s.day][0]:"var(--muted)")}),h("span",{text:DAYS[s.day]||"Workout"})),
        h("div",{class:"muted",text:fmtDate(s.date,true)+", "+(s.entries||[]).length+" exercises"})));
    });

  }

}
function startDay(k){
  if(st.draft&&st.draft.day!==k){
    var n=Object.keys(st.draft.entries||{}).filter(function(x){return entryDone(st.draft.entries[x])}).length;
    if(n&&!window.confirm("You have an unsaved "+DAYS[st.draft.day]+" workout. Discard it and start "+DAYS[k]+"?"))return;
    st.draft=null;
  }
  if(!st.draft)st.draft={day:k,date:todayStr(),entries:{}};
  saveDraft();go("list");
}

function vList(){
  var day=st.draft.day;setDayTone(day);
  var list=exForDay(day);
  var kids=[topbar(DAYS[day],fmtDate(st.draft.date,true),function(){go("home")}),statusNote()];
  if(!list.length&&st.profLoaded)kids.push(h("div",{class:"empty",text:"No exercises for "+DAYS[day]+" yet. Add the first one."}));
  var g=h("div",{class:"grid"});
  list.forEach(function(e){
    var en=st.draft.entries[e.id];var done=entryDone(en);var last=lastFor(e.id);
    var nSets=done?en.sets.filter(function(x){return num(x.r)!=null||num(x.w)!=null}).length:0;
    g.appendChild(h("button",{class:"card"+(done?" done":""),onclick:function(){st.exId=e.id;go("ex")}},
      done?h("span",{class:"check",html:UI.check}):null,
      picture(e),
      h("span",{class:"nm",text:e.name}),
      h("span",{class:"lt",text:done?nSets+" set"+(nSets>1?"s":"")+" logged":(last?"Last: "+fmtDate(last.date):"New")})));
  });
  g.appendChild(h("button",{class:"card add",onclick:function(){st.addQ="";st.custom=null;st.saveErr="";go("add")},"aria-label":"Add an exercise"},
    h("span",{class:"plus",text:"+"}),h("span",{text:"Add new"})));
  kids.push(g);
  var n=Object.keys(st.draft.entries).filter(function(k){return entryDone(st.draft.entries[k])}).length;
  kids.push(h("div",{class:"bar"},h("div",{class:"in"},h("button",{class:"btn",disabled:!n,onclick:function(){st.saveErr="";go("review")},text:n?"Finish workout ("+n+")":"Finish workout"}))));
  return kids;
}

function vEx(){
  var e=exById(st.exId);if(!e){go("list");return[]}
  var day=st.draft.day;setDayTone(day);
  var last=lastFor(e.id);
  var en=st.draft.entries[e.id];
  if(!en){en=st.draft.entries[e.id]={sets:[{w:"",r:""},{w:"",r:""},{w:"",r:""}],note:""};saveDraft()}
  var kids=[h("div",{class:"topbar"},h("button",{class:"back","aria-label":"Back to exercises",html:UI.back,onclick:function(){finishEx(e.id)}}),h("div",{class:"sub",text:DAYS[day]+", "+fmtDate(st.draft.date)}))];
  kids.push(h("div",{class:"ex-head"},picture(e),h("h1",{text:e.name})));
  var lastBox=h("div",{class:"last"});
  if(last){
    var unit=last.unit?" "+last.unit:"";
    lastBox.appendChild(h("div",{class:"lh"},h("b",{text:"Last time"}),h("span",{class:"muted",text:fmtDate(last.date,true)})));
    var c=h("div",{class:"chips"});
    last.sets.forEach(function(s){c.appendChild(h("span",{class:"chip"},fmtN(s.w),h("small",{text:unit})," \u00d7 "+fmtN(s.r)))});
    lastBox.appendChild(c);
    if(last.note)lastBox.appendChild(h("div",{class:"nt",text:last.note}));
    lastBox.appendChild(h("button",{class:"linkbtn",onclick:function(){
      en.sets=last.sets.map(function(s){return{w:fmtN(s.w),r:fmtN(s.r)}});while(en.sets.length<3)en.sets.push({w:"",r:""});saveDraft();render();
    },text:"Fill in last time's numbers"}));
  }else{
    lastBox.appendChild(h("div",{class:"lh"},h("b",{text:"Last time"})));
    lastBox.appendChild(h("div",{class:"muted",text:st.sessLoaded?"First time logging this one.":"Loading history\u2026"}));
  }
  kids.push(lastBox);
  var sets=h("div",{class:"sets"});
  en.sets.forEach(function(s,i){
    var prev=last&&last.sets[i];
    sets.appendChild(h("div",{class:"set"},
      h("div",{class:"n",text:String(i+1)}),
      h("div",{class:"field"},h("label",{for:"w"+i,text:"Weight"}),h("input",{type:"text",inputmode:"decimal",autocomplete:"off",id:"w"+i,value:s.w,placeholder:prev?fmtN(prev.w):"",oninput:function(ev){s.w=ev.target.value;saveDraft()}})),
      h("div",{class:"field"},h("label",{for:"r"+i,text:"Reps"}),h("input",{type:"text",inputmode:"numeric",autocomplete:"off",id:"r"+i,value:s.r,placeholder:prev?fmtN(prev.r):"",oninput:function(ev){s.r=ev.target.value;saveDraft()}})),
      en.sets.length>1?h("button",{class:"rm","aria-label":"Remove set "+(i+1),html:UI.x,onclick:function(){en.sets.splice(i,1);saveDraft();render()}}):h("span")));
  });
  kids.push(sets);
  kids.push(h("button",{class:"addset",onclick:function(){en.sets.push({w:"",r:""});saveDraft();render();var el=document.getElementById("w"+(en.sets.length-1));if(el)el.focus()},text:"+ Add set"}));
  kids.push(h("label",{class:"lbl",for:"note",text:"Note"}));
  var ta=h("textarea",{id:"note",placeholder:"Form, pain, machine settings\u2026",oninput:function(ev){en.note=ev.target.value;saveDraft()}});ta.value=en.note||"";
  kids.push(ta);
  kids.push(h("div",{class:"bar"},h("div",{class:"in"},h("button",{class:"btn",onclick:function(){finishEx(e.id)},text:"Done"}))));
  return kids;
}
function finishEx(id){var en=st.draft.entries[id];if(en&&!entryDone(en)&&!(en.note||"").trim())delete st.draft.entries[id];saveDraft();go("list")}

/* add exercise: library first, custom as fallback */
function vAdd(){
  var day=st.draft.day;setDayTone(day);
  var kids=[topbar("Add exercise",DAYS[day],function(){go("list")})];
  if(st.custom)return kids.concat(vCustom(day));
  var have={};exForDay(day).forEach(function(e){have[e.lib||e.id]=true});
  var q=st.addQ.trim().toLowerCase();
  var search=h("input",{class:"input",type:"search",placeholder:"Search exercises",value:st.addQ,autocomplete:"off","aria-label":"Search exercises",oninput:function(ev){st.addQ=ev.target.value;paintLib()}});
  kids.push(search);
  var libBox=h("div",{class:"libbox"});kids.push(libBox);
  function paintLib(){
    libBox.innerHTML="";q=st.addQ.trim().toLowerCase();
    var order=MUSCLES.slice().sort(function(a,b){var ad=MUSCLE_DAYS[a[0]].indexOf(day)>=0?0:1,bd=MUSCLE_DAYS[b[0]].indexOf(day)>=0?0:1;return ad-bd});
    var any=false;
    order.forEach(function(m){
      var items=LIB.filter(function(e){return e.muscle===m[0]&&!have[e.id]&&(!q||e.name.toLowerCase().indexOf(q)>=0)});
      if(!items.length)return;any=true;
      libBox.appendChild(h("h2",{class:"section-h",text:m[1]}));
      var g=h("div",{class:"grid"});
      items.forEach(function(it){g.appendChild(h("button",{class:"card lib",onclick:function(){addFromLib(it)}},picture({lib:it.id}),h("span",{class:"nm",text:it.name})))});
      libBox.appendChild(g);
    });
    if(!any)libBox.appendChild(h("p",{class:"muted",text:"No match in the library."}));
    libBox.appendChild(h("button",{class:"btn ghost",style:"margin-top:18px",onclick:function(){st.custom={name:st.addQ.trim(),muscle:null};render()},text:"Add a custom exercise"}));
    if(st.saveErr)libBox.appendChild(h("div",{class:"err",text:st.saveErr}));
  }
  paintLib();
  return kids;
}
function vCustom(day){
  var f=st.custom;var kids=[];
  kids.push(h("label",{class:"lbl",for:"exname",text:"Name"}));
  var btn;
  function upd(){btn.disabled=!f.name.trim()||!f.muscle||!st.profRef}
  kids.push(h("input",{class:"input",id:"exname",autocomplete:"off",placeholder:"e.g. Landmine press",value:f.name,oninput:function(ev){f.name=ev.target.value;upd()}}));
  kids.push(h("div",{class:"lbl",style:"margin-top:18px",text:"Main muscle"}));
  var seg=h("div",{class:"seg wrap"});
  MUSCLES.forEach(function(m){seg.appendChild(h("button",{"aria-pressed":f.muscle===m[0]?"true":"false",text:m[1],onclick:function(ev){f.muscle=m[0];Array.prototype.forEach.call(seg.children,function(b){b.setAttribute("aria-pressed","false")});ev.currentTarget.setAttribute("aria-pressed","true");upd()}}))});
  kids.push(seg);
  kids.push(h("p",{class:"muted small",text:"It'll get a picture after your workout, ready for next time."}));
  if(st.saveErr)kids.push(h("div",{class:"err",text:st.saveErr}));
  btn=h("button",{class:"btn",onclick:function(){addCustom(f.name.trim(),f.muscle,day)},text:"Add exercise"});upd();
  kids.push(h("div",{class:"bar"},h("div",{class:"in"},btn)));
  return kids;
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"ex"}
function cleanList(){return st.exercises.map(function(e){var o={id:e.id,name:e.name,days:(e.days||[]).slice()};if(e.lib)o.lib=e.lib;if(e.muscle)o.muscle=e.muscle;if(e.pose)o.pose=e.pose;return o})}
function writeExercises(list,then){
  st.saveErr="";
  st.profRef.set({exercises:list}).then(function(){st.exercises=list;then()}).catch(function(e){
    st.saveErr=e&&e.code==="quota_exceeded"?"Storage is full, so that change wasn't saved.":"Couldn't save that. Check your connection and try again.";render()});
}
function addFromLib(it){
  if(!st.profRef)return;var day=st.draft.day;var list=cleanList();
  var ex=null;list.forEach(function(e){if((e.lib||e.id)===it.id)ex=e});
  if(ex){if(ex.days.indexOf(day)<0)ex.days.push(day)}else{ex={id:it.id,name:it.name,days:[day],lib:it.id,muscle:it.muscle};list.push(ex)}
  writeExercises(list,function(){st.exId=ex.id;go("ex")});
}
function addCustom(name,muscle,day){
  if(!name||!muscle||!st.profRef)return;var list=cleanList();
  var ex={id:slug(name)+"-"+Math.random().toString(36).slice(2,6),name:name,days:[day],muscle:muscle};list.push(ex);
  writeExercises(list,function(){st.custom=null;st.exId=ex.id;go("ex")});
}

function vReview(){
  var day=st.draft.day;setDayTone(day);
  var kids=[topbar("Finish "+DAYS[day],fmtDate(st.draft.date,true),function(){go("list")})];
  collect().forEach(function(en){
    var box=h("div",{class:"rv"},h("b",{text:en.name}));
    var c=h("div",{class:"chips",style:"margin-top:8px"});
    en.sets.forEach(function(s){c.appendChild(h("span",{class:"chip",text:(s.w!=null?fmtN(s.w):"\u2013")+" \u00d7 "+(s.r!=null?fmtN(s.r):"\u2013")}))});
    box.appendChild(c);if(en.note)box.appendChild(h("div",{class:"muted small",style:"margin-top:8px",text:en.note}));
    kids.push(box);
  });
  if(st.saveErr)kids.push(h("div",{class:"err",text:st.saveErr}));
  kids.push(h("button",{class:"btn ghost",style:"margin-top:8px",onclick:function(){if(window.confirm("Discard this workout without saving?")){st.draft=null;saveDraft();go("home")}},text:"Discard workout"}));
  kids.push(h("div",{class:"bar"},h("div",{class:"in"},h("button",{class:"btn",disabled:st.saving||!st.profRef,onclick:saveWorkout,text:st.saving?"Saving\u2026":(st.profRef?"Save workout":"Can't save here")}))));
  return kids;
}
function collect(){
  var out=[];var d=st.draft;var order=exForDay(d.day).map(function(e){return e.id});
  Object.keys(d.entries).forEach(function(k){if(order.indexOf(k)<0)order.push(k)});
  order.forEach(function(id){var en=d.entries[id];if(!en)return;
    var sets=en.sets.map(function(s){return{w:num(s.w),r:num(s.r)}}).filter(function(s){return s.w!=null||s.r!=null});
    if(!sets.length)return;var e=exById(id);var o={ex:id,name:e?e.name:id,sets:sets};var n=(en.note||"").trim();if(n)o.note=n;out.push(o)});
  return out;
}
function saveWorkout(){
  if(!st.profRef||st.saving)return;var entries=collect();if(!entries.length)return;
  var d=st.draft;var body={date:d.date,day:d.day,savedAt:new Date().toISOString(),entries:entries};
  st.saving=true;st.saveErr="";render();
  st.profRef.collection("sessions").doc(d.date+"-"+d.day+"-"+Date.now().toString(36)).set(body).then(function(){
    st.saving=false;st.lastSaved=body;st.draft=null;saveDraft();st.drawing={};go("saved");
  }).catch(function(e){st.saving=false;st.saveErr=e&&e.code==="quota_exceeded"?"Storage is full, so this workout wasn't saved.":"Couldn't save. Your workout is kept on this device; try again.";render()});
}

/* after-workout pictures for exercises that don't have one */
function needPictures(){var s=st.lastSaved;if(!s)return[];var out=[];s.entries.forEach(function(en){var e=exById(en.ex);if(e&&!poseOf(e))out.push(e)});return out}
var POSE_GUIDE=null;
function poseGuide(){
  if(POSE_GUIDE)return POSE_GUIDE;
  var ex=["db-curl","lat-pulldown","bench","leg-ext","db-lateral-raise"].map(function(id){var l=LIBMAP[id];return l.name+": "+JSON.stringify(l.pose)}).join("\n");
  POSE_GUIDE="You draw simple line-art exercise figures by writing a pose as JSON for a fixed renderer.\n"+
  "Coordinates: x grows right, y grows down. The scene is about 200x200, the floor is y=191, a standing adult is about 150 tall (head center near y=40, ankles near y=184). Side view, the person faces right (+x).\n"+
  "Fields: head [x,y] (center), neck [x,y] (base of neck), hip [x,y]. na = near arm [[elbowX,elbowY],[handX,handY]], fa = far arm (same shape, a few px behind). nl = near leg [[kneeX,kneeY],[ankleX,ankleY],[footDirX,footDirY]], fl = far leg. face [dx,dy] optional head direction. front:true switches to a front view (arms and legs to the sides).\n"+
  "Keep limb lengths realistic: upper arm about 28, forearm about 26, thigh about 38, shin about 34.\n"+
  "Equipment lists: bg (behind body), mid (between far and near limbs), fg (in front). Each item is [name, ...numbers]:\n"+
  "['floor'], ['db',x,y,angleDeg] dumbbell, ['dbEnd',x,y] dumbbell seen end-on, ['plate',x,y,r] barbell seen end-on, ['barTop',x1,y1,x2,y2] bar or straight line handle, ['pad',x1,y1,x2,y2,thickness] cushion (negative thickness puts it on the other side), ['post',x,y1,y2] vertical machine frame, ['leg',x1,y1,x2,y2] thin frame line, ['pulley',x,y], ['cable',x1,y1,x2,y2], ['stack',x,y,height] weight stack, ['handle',x,y,angleDeg], ['rope',x,y,dx,dy], ['box',x,y,w,h] seat or bench block, ['arrow',x1,y1,x2,y2] motion arrow.\n"+
  "Examples:\n"+ex+"\n"+
  "Show the most recognizable moment of the movement (usually the top or the hardest point) with the equipment that defines it.";
  return POSE_GUIDE;
}
function drawOne(e){
  st.drawing[e.id]="busy";paintSaved();
  var muscle=MUSCLE_NAME[e.muscle]||"";
  var input=poseGuide()+"\n\nNow write the pose for: \""+e.name+"\""+(muscle?" (main muscle: "+muscle+")":"")+".\nAnswer with only a JSON object: {\"pose\": {...}}";
  return st.sample.json(input,{modelTier:"default"}).then(function(res){
    var p=res&&res.pose;if(!validPose(p))throw{code:"bad_pose"};
    try{window.__fig.render(p)}catch(err){throw{code:"bad_pose"}}
    var list=cleanList();list.forEach(function(x){if(x.id===e.id)x.pose=p});
    return st.profRef.set({exercises:list}).then(function(){st.exercises=list;st.drawing[e.id]="done";paintSaved()});
  }).catch(function(err){
    st.drawing[e.id]=err&&err.code==="not_granted"?"denied":(err&&err.code==="rate_limited"?"limited":"failed");paintSaved();
  });
}
function vSaved(){
  var s=st.lastSaved;setDayTone(s?s.day:null);
  var n=s?s.entries.length:0;var sets=0;if(s)s.entries.forEach(function(e){sets+=e.sets.length});
  var box=h("div",{id:"picbox"});
  var kids=[h("div",{class:"saved"},h("div",{class:"ring"}),h("div",{class:"big",text:"Saved"}),h("p",{class:"muted",text:(s?DAYS[s.day]+", ":"")+n+" exercises, "+sets+" sets"})),box,
    h("div",{class:"bar"},h("div",{class:"in"},h("button",{class:"btn",onclick:function(){go("home")},text:"Back to start"})))];
  setTimeout(paintSaved,0);
  return kids;
}
function paintSaved(){
  var box=document.getElementById("picbox");if(!box)return;box.innerHTML="";
  var need=needPictures();var drawn=st.lastSaved?st.lastSaved.entries.map(function(en){return exById(en.ex)}).filter(function(e){return e&&st.drawing[e.id]==="done"}):[];
  if(!need.length&&!drawn.length)return;
  var card=h("div",{class:"piccard"});
  card.appendChild(h("h2",{class:"section-h",text:need.length?"New exercises need a picture":"Pictures ready"}));
  if(need.length&&!st.sample)card.appendChild(h("p",{class:"muted small",text:"Drawing isn't available in this view. Open the page in claude.ai to draw them."}));
  need.concat(drawn.filter(function(e){return need.indexOf(e)<0})).forEach(function(e){
    var state=st.drawing[e.id];
    var msg={busy:"Drawing\u2026",failed:"Couldn't draw it. Try again.",denied:"Drawing was turned off for this page.",limited:"Usage limit reached. Try later."}[state]||"";
    card.appendChild(h("div",{class:"picrow"},picture(e),
      h("div",{class:"grow"},h("div",{text:e.name}),msg?h("div",{class:"muted small",text:msg}):null),
      st.sample&&state!=="done"&&state!=="busy"&&state!=="denied"?h("button",{class:"pill",onclick:function(){drawOne(e)},text:state?"Retry":"Draw"}):null));
  });
  var todo=need.filter(function(e){var s=st.drawing[e.id];return !s||s==="failed"});
  if(st.sample&&todo.length>1)card.appendChild(h("button",{class:"btn",style:"margin-top:12px",onclick:function(){todo.reduce(function(p,e){return p.then(function(){return drawOne(e)})},Promise.resolve())},text:"Draw all "+todo.length}));
  box.appendChild(card);
}

var VIEWS={home:vHome,list:vList,ex:vEx,add:vAdd,review:vReview,saved:vSaved};
function render(){
  if(st.view!=="home"&&st.view!=="saved"&&!st.draft)st.view="home";
  var app=document.getElementById("app");app.innerHTML="";
  VIEWS[st.view]().forEach(function(k){if(k)app.appendChild(k)});
}
function go(v){st.view=v;render();window.scrollTo(0,0)}
function rerender(){if(st.view==="ex"||st.view==="add"||st.view==="saved")return;render()}
render();

(async function(){
  var db=null,user=null;
  try{db=await window.claude.use("db");user=await window.claude.use("user")}catch(e){}
  try{st.sample=await window.claude.use("sample")}catch(e){st.sample=null}
  if(!db||!user){st.offline=true;rerender();return}
  var uid=null;try{uid=await user.id()}catch(e){}
  if(!uid){st.offline=true;rerender();return}
  st.profRef=db.doc("data/users/"+uid+"/profile");
  var timer=setTimeout(function(){st.slow=true;rerender()},10000);
  function maybeClear(){if(st.profLoaded&&st.sessLoaded){clearTimeout(timer);st.slow=false}}
  st.profRef.onSnapshot(function(s){var d=s.exists?s.data():null;st.exercises=d&&Array.isArray(d.exercises)?d.exercises:[];
    if(!s.metadata.fromCache)st.profLoaded=true;maybeClear();rerender()},function(){st.profLoaded=true;st.offline=true;clearTimeout(timer);rerender()});
  st.profRef.collection("sessions").orderBy("savedAt","desc").limit(300).onSnapshot(function(q){
    st.sessions=q.docs.map(function(d){var v=d.data();return{id:d.id,date:v.date,day:v.day,savedAt:v.savedAt,entries:v.entries||[]}});
    if(!q.metadata.fromCache)st.sessLoaded=true;maybeClear();rerender()},function(){st.sessLoaded=true;clearTimeout(timer);rerender()});
})();
})();
